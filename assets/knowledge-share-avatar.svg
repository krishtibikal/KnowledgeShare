    <rect x="310" y="160" width="145" height="500" rx="72" fill="#f4705b" transform="rotate(-30 382 410)"/>
    <rect x="704" y="390" width="135" height="245" rx="67" fill="#c7eb4c" transform="rotate(-7 771 512)"/>
